<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Trilingual technical IFRS and IAS application reference"><title>ATLAS IFRS | Application Reference</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&display=swap');
:root{--ink:#23464c;--teal:#176f74;--line:#dce6e4;--muted:#607b78}
*{box-sizing:border-box}body{margin:0;font:15px/1.65 'DM Sans',Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 90% 0%,#e5f2eb,transparent 42%),#f5f8f7}header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px max(4%,calc((100vw - 1400px)/2));border-bottom:1px solid var(--line);background:#ffffffdd;position:sticky;top:0;z-index:4;backdrop-filter:blur(15px)}.brand{display:flex;align-items:center;gap:12px;font:800 19px Manrope}.brand em{color:var(--teal);font-style:normal}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;color:white;background:var(--teal);font-size:28px}.brand small{display:block;font:700 9px 'DM Sans';letter-spacing:2px;color:#829590}button,select,input{font:inherit}button{cursor:pointer}.langs{display:flex;gap:4px;background:#ecf3ef;padding:4px;border-radius:11px}.langs button{border:0;background:transparent;padding:7px 12px;border-radius:8px;color:#6c8680;font-weight:700}.langs button.active{background:#fff;color:var(--teal);box-shadow:0 2px 6px #143e3417}main{max-width:1480px;margin:auto;padding:27px 4%}.hero{border-radius:23px;padding:34px 40px;background:linear-gradient(113deg,#d9eee6,#e9f1ea 58%,#e9e7f7);border:1px solid #c7e2d7;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:430px;height:430px;border-radius:50%;border:60px solid #aedbd15c;right:-135px;bottom:-290px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:700;color:#548579}.hero h1{font:800 clamp(30px,4vw,57px)/1.15 Manrope;margin:25px 0 10px;max-width:840px;letter-spacing:-2px}.hero p{max-width:850px;color:#587973}.herofoot{display:flex;gap:25px;margin-top:38px;border-top:1px solid #b2d7cf;padding-top:14px;font-size:11px;letter-spacing:1px;font-weight:700;color:#548079}.layout{display:grid;grid-template-columns:310px 1fr;gap:22px;margin-top:22px;align-items:start}aside,article{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 35px #143b340b}aside{padding:22px;position:sticky;top:95px}aside h2{font:800 17px Manrope;margin:0 0 17px}input,select{display:block;width:100%;padding:12px;margin-bottom:11px;border:1px solid #d7e7e1;border-radius:10px;background:#f7faf9;color:#315c5a}nav{max-height:57vh;overflow-y:auto}nav button{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;padding:11px;border-radius:10px;color:#2e5255;margin:3px 0}nav button:hover{background:#eff7f3}nav button.active{background:#e1f1e9;border-color:#c5e2d6;color:#105e60}nav small{display:block;color:#408d7f;letter-spacing:.6px;font-size:10px}article{min-height:580px;padding:35px 42px}.pill{display:inline-block;background:#e3f2ec;border-radius:20px;padding:5px 12px;color:#24786e;font-size:11px;font-weight:700;margin:0 7px 7px 0}.pill:nth-child(2){background:#edeafa;color:#7562a8}.pill:nth-child(3){background:#fff0e8;color:#95634d}h2{font:800 clamp(25px,3vw,36px)/1.25 Manrope;letter-spacing:-1px;margin:17px 0;color:#264951}h3{font:800 17px Manrope;color:#19746f}section{border-top:1px solid #e2ece8;margin-top:25px;padding-top:17px}article p{line-height:1.9;color:#426267}.case{padding:20px;background:linear-gradient(130deg,#edf7f2,#f0f4f9);border-radius:12px;border-left:4px solid #2c988b;white-space:pre-line;color:#2a5555}.links a{display:inline-block;text-decoration:none;padding:10px 14px;background:#e4f2ee;color:#176f74;border-radius:9px;margin:5px;font-weight:700;font-size:12px}footer{padding:22px;background:#eaf3ef;color:#56776f;border-radius:12px;font-size:12px;margin-top:28px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{position:static}nav{max-height:240px}article{padding:25px}.hero{padding:26px}.herofoot{flex-wrap:wrap}}@media(max-width:500px){.brand{font-size:16px}.brand small{font-size:8px}.hero h1{letter-spacing:-1px}header{padding:12px}main{padding:15px}article{padding:20px}}
</style></head><body><header><div class="brand"><span class="mark">◈</span><div>ATLAS <em>IFRS</em><small>APPLICATION REFERENCE</small></div></div><div class="langs"><button data-lang="it">IT</button><button data-lang="en">EN</button><button data-lang="de">DE</button></div></header><main><div class="hero"><span class="eyebrow">GLOBAL ACCOUNTING STANDARDS / TECHNICAL REFERENCE</span><h1 id="heading"></h1><p id="summary"></p><div class="herofoot"><span>IFRS · IAS · SUSTAINABILITY</span><span>RECOGNITION → MEASUREMENT → DISCLOSURE</span><span>IT · EN · DE</span></div></div><div class="layout"><aside><h2 id="catalogTitle">Standards index</h2><input id="search" placeholder="Search"><select id="filter"></select><nav id="nav"></nav></aside><article id="article"></article></div><footer id="footer"></footer></main><script>const DB={"standards":[["IFRS 1","First-time Adoption of IFRS","Transition"],["IFRS 2","Share-based Payment","Equity"],["IFRS 3","Business Combinations","Groups"],["IFRS 5","Non-current Assets Held for Sale","Assets"],["IFRS 6","Exploration and Evaluation","Industry"],["IFRS 7","Financial Instruments: Disclosures","Financial"],["IFRS 8","Operating Segments","Presentation"],["IFRS 9","Financial Instruments","Financial"],["IFRS 10","Consolidated Financial Statements","Groups"],["IFRS 11","Joint Arrangements","Groups"],["IFRS 12","Disclosure of Interests in Other Entities","Groups"],["IFRS 13","Fair Value Measurement","Measurement"],["IFRS 14","Regulatory Deferral Accounts","Industry"],["IFRS 15","Revenue from Contracts with Customers","Revenue"],["IFRS 16","Leases","Assets"],["IFRS 17","Insurance Contracts","Industry"],["IFRS 18","Presentation and Disclosure in Financial Statements","Presentation"],["IFRS 19","Subsidiaries without Public Accountability: Disclosures","Presentation"],["IFRS 20","Regulatory Assets and Regulatory Liabilities","Industry"],["IAS 1","Presentation of Financial Statements","Presentation"],["IAS 2","Inventories","Assets"],["IAS 7","Statement of Cash Flows","Presentation"],["IAS 8","Accounting Policies, Changes in Accounting Estimates and Errors","Presentation"],["IAS 10","Events after the Reporting Period","Presentation"],["IAS 12","Income Taxes","Tax"],["IAS 16","Property, Plant and Equipment","Assets"],["IAS 19","Employee Benefits","Liabilities"],["IAS 20","Accounting for Government Grants","Revenue"],["IAS 21","The Effects of Changes in Foreign Exchange Rates","Financial"],["IAS 23","Borrowing Costs","Assets"],["IAS 24","Related Party Disclosures","Presentation"],["IAS 26","Accounting and Reporting by Retirement Benefit Plans","Industry"],["IAS 27","Separate Financial Statements","Groups"],["IAS 28","Investments in Associates and Joint Ventures","Groups"],["IAS 29","Financial Reporting in Hyperinflationary Economies","Presentation"],["IAS 32","Financial Instruments: Presentation","Financial"],["IAS 33","Earnings per Share","Presentation"],["IAS 34","Interim Financial Reporting","Presentation"],["IAS 36","Impairment of Assets","Assets"],["IAS 37","Provisions, Contingent Liabilities and Contingent Assets","Liabilities"],["IAS 38","Intangible Assets","Assets"],["IAS 39","Financial Instruments: Recognition and Measurement","Financial"],["IAS 40","Investment Property","Assets"],["IAS 41","Agriculture","Industry"],["IFRS S1","General Requirements for Disclosure of Sustainability-related Financial Information","Sustainability"],["IFRS S2","Climate-related Disclosures","Sustainability"]],"details":{"IFRS 9":["Classificare le attività finanziarie considerando modello di business e test SPPI; distinguere costo ammortizzato, FVOCI e FVTPL. Misurare le ECL secondo Stage 1 (12 mesi), Stage 2 e Stage 3 (lifetime), sulla base delle condizioni applicabili. Documentare criteri SICR, dati prospettici, tasso effettivo e movimenti della loss allowance.","Classify financial assets using the business model and SPPI test; distinguish amortised cost, FVOCI and FVTPL. Measure ECL using Stage 1 (12 months) and Stage 2/3 (lifetime), as applicable. Document SICR policies, forward-looking inputs, effective interest rates and loss-allowance movements.","Finanzielle Vermögenswerte anhand Geschäftsmodell und SPPI-Test klassifizieren; fortgeführte Anschaffungskosten, FVOCI und FVTPL unterscheiden. Erwartete Kreditverluste nach Stufe 1 (12 Monate) bzw. Stufe 2/3 (Laufzeit) bemessen. SICR-Kriterien, Zukunftsinformationen, Effektivzins und Wertberichtigungsentwicklung dokumentieren.","Gross loan €100,000, allowance rises from €5,000 to €12,000: additional expense €7,000. Debit impairment expense €7,000; credit loss allowance €7,000. Net carrying amount €88,000."],"IFRS 16":["Identificare se il contratto attribuisce il controllo dell'uso di un'attività identificata. Il locatario rileva in genere attività per diritto d'uso e passività per leasing alla data d'inizio; successivamente registra ammortamento, interessi e pagamenti. Valutare separatamente esenzioni per contratti di breve durata e beni di modesto valore.","Assess whether a contract conveys control of the use of an identified asset. A lessee generally records a right-of-use asset and lease liability at commencement; later it recognises depreciation, interest and lease payments. Evaluate short-term and low-value exemptions separately.","Prüfen, ob ein Vertrag die Kontrolle über die Nutzung eines identifizierten Vermögenswerts vermittelt. Leasingnehmer erfassen grundsätzlich Nutzungsrecht und Leasingverbindlichkeit zu Beginn; später Abschreibung, Zinsen und Zahlungen. Ausnahmen für kurzfristige und geringwertige Leasingverhältnisse prüfen.","At inception, assuming both measurements equal €60,000: debit right-of-use asset €60,000; credit lease liability €60,000."],"IAS 36":["Verificare gli indicatori di impairment e testare l'avviamento almeno annualmente. L'importo recuperabile è il maggiore tra valore d'uso e fair value al netto dei costi di dismissione. Rilevare la perdita se il valore contabile è superiore al recuperabile; applicare le regole particolari per goodwill e unità generatrici di flussi finanziari.","Assess impairment indicators and test goodwill at least annually. Recoverable amount is the higher of value in use and fair value less costs of disposal. Record an impairment loss if carrying amount exceeds recoverable amount; apply CGU and goodwill-specific requirements.","Wertminderungsindikatoren prüfen und Geschäfts- oder Firmenwert mindestens jährlich testen. Der erzielbare Betrag ist der höhere Wert aus Nutzungswert und beizulegendem Zeitwert abzüglich Veräußerungskosten. Eine Wertminderung erfassen, wenn der Buchwert den erzielbaren Betrag übersteigt; CGU- und Goodwill-Regeln beachten.","Asset carrying amount €100,000; value in use €87,000; fair value less disposal costs €90,000: recoverable amount €90,000; impairment €10,000."],"IAS 12":["Determinare imposte correnti e differite confrontando valori contabili e basi fiscali. Rilevare passività per differenze temporanee imponibili e attività per differenze deducibili quando i criteri di recuperabilità sono soddisfatti. Analizzare eccezioni, imposte direttamente in OCI e informativa.","Identify current and deferred taxes by comparing carrying amounts with tax bases. Recognise liabilities for taxable temporary differences and assets for deductible differences when recoverability conditions are met. Review exceptions, taxes recognised in OCI and disclosures.","Tatsächliche und latente Steuern durch Gegenüberstellung von Buchwert und Steuerbasis bestimmen. Passive latente Steuern für steuerpflichtige temporäre Differenzen und aktive latente Steuern bei erfüllten Ansatzvoraussetzungen erfassen. Ausnahmen, OCI-Steuern und Anhangangaben prüfen.","Carrying amount €80,000; tax base €100,000; deductible difference €20,000 × 25% = deferred tax asset €5,000, if recognition conditions are satisfied."],"IFRS 13":["Definire l'unità di valutazione secondo lo standard pertinente, il mercato principale o più vantaggioso, e il prezzo di uscita tra partecipanti al mercato. Scegliere tecniche valutative appropriate, massimizzando input osservabili; determinare livello 1, 2 o 3 e fornire disclosure.","Determine the unit of account under the relevant standard, identify the principal or most advantageous market and estimate an exit price between market participants. Select suitable valuation techniques, maximise observable inputs, assign hierarchy level 1, 2 or 3, and disclose assumptions.","Bewertungseinheit nach dem einschlägigen Standard bestimmen, Hauptmarkt bzw. vorteilhaftesten Markt identifizieren und einen Exit-Preis unter Marktteilnehmern schätzen. Geeignete Methoden und möglichst beobachtbare Inputs verwenden; Hierarchiestufe 1, 2 oder 3 bestimmen und Angaben machen.","An identical instrument with an unadjusted quoted price in an active accessible market usually uses a Level 1 fair-value input."],"IFRS 15":["Identificare contratto e obbligazioni di prestazione; determinare prezzo della transazione, allocarlo e rilevare ricavi quando o mentre il controllo è trasferito. Valutare corrispettivo variabile, componenti finanziarie significative e contract assets/liabilities.","Identify the contract and performance obligations; determine and allocate the transaction price, then recognise revenue when or as control transfers. Consider variable consideration, significant financing components and contract assets/liabilities.","Vertrag und Leistungsverpflichtungen identifizieren; Transaktionspreis bestimmen und zuordnen; Umsatzerlöse bei oder während Übertragung der Verfügungsgewalt erfassen. Variable Gegenleistung, Finanzierungskomponenten und Vertragsvermögenswerte/-schulden beachten.","Service delivered for €8,000 with unconditional right to payment: debit trade receivable €8,000; credit revenue €8,000."],"IFRS 10":["Valutare controllo usando potere sulle attività rilevanti, esposizione a rendimenti variabili e capacità di usare il potere per influenzarli. Consolidare controllate dal momento dell'acquisizione del controllo ed eliminare saldi e operazioni infragruppo.","Assess control using power over relevant activities, exposure to variable returns and the ability to use power to affect those returns. Consolidate subsidiaries from obtaining control and eliminate intragroup balances and transactions.","Beherrschung anhand von Verfügungsgewalt über maßgebliche Tätigkeiten, variablen Rückflüssen und der Fähigkeit, diese zu beeinflussen, beurteilen. Tochterunternehmen ab Kontrollerlangung konsolidieren und konzerninterne Salden sowie Geschäfte eliminieren.","Parent records receivable €40,000 from subsidiary: eliminate intragroup receivable and payable on consolidation."]},"lang":[{"code":"it","head":"Applicazione pratica degli standard contabili","summary":"Una guida tecnica operativa a rilevazione, valutazione, presentazione e informativa. Seleziona uno standard per consultare l'applicazione e i casi pratici.","search":"Cerca standard o argomento","all":"Tutte le aree","scope":"Applicazione e criteri","example":"Caso applicativo","check":"Checklist operativa","disclose":"Presentazione e informativa","refs":"Fonti ufficiali","fallback":"Scheda di riferimento: verificare l'ambito di applicazione, le definizioni, il modello di rilevazione e valutazione, le eccezioni e le informazioni richieste nella versione ufficiale in vigore. Questa scheda è una mappa operativa iniziale, non una riproduzione integrale del testo IFRS.","checkText":"1. Definire entità, transazione e data di riferimento. 2. Confermare standard applicabile ed eventuali eccezioni. 3. Documentare giudizi e stime. 4. Riconciliare scritture, prospetti e disclosure.","discloseText":"Confrontare presentazione, policy contabili, stime significative e disclosure con i paragrafi della versione ufficiale applicabile; considerare anche standard trasversali e normativa locale.","coming":"Standard con applicazione futura: verificare date, applicazione anticipata ed endorsement locale.","year":"Catalogo tecnico · non sostituisce i testi autorizzati IFRS."},{"code":"en","head":"Accounting standards in practice","summary":"An operational technical reference for recognition, measurement, presentation and disclosure. Select a standard for application notes and worked scenarios.","search":"Search standard or topic","all":"All topics","scope":"Application and requirements","example":"Worked application","check":"Implementation checklist","disclose":"Presentation and disclosure","refs":"Official references","fallback":"Reference entry: assess scope, definitions, recognition and measurement models, exceptions and disclosures against the currently applicable authoritative standard. This entry is an initial operational map, not a reproduction of IFRS requirements.","checkText":"1. Identify entity, transaction and reporting date. 2. Confirm applicable standard and exemptions. 3. Document judgements and estimates. 4. Reconcile journal entries, statements and disclosures.","discloseText":"Check presentation, accounting policies, significant estimates and disclosures against the applicable authoritative paragraphs; consider cross-cutting standards and local requirements.","coming":"Future-effective standard: verify date, early adoption and local endorsement.","year":"Technical catalogue · not a substitute for authoritative IFRS texts."},{"code":"de","head":"Rechnungslegungsstandards praktisch anwenden","summary":"Technisches Nachschlagewerk zu Ansatz, Bewertung, Ausweis und Anhangangaben. Standard auswählen, um Regeln und Praxisbeispiele einzusehen.","search":"Standard oder Thema suchen","all":"Alle Bereiche","scope":"Anwendung und Anforderungen","example":"Anwendungsbeispiel","check":"Umsetzungscheckliste","disclose":"Ausweis und Angaben","refs":"Offizielle Quellen","fallback":"Referenzeintrag: Anwendungsbereich, Definitionen, Ansatz und Bewertung, Ausnahmen sowie Angaben anhand des aktuell maßgeblichen Originalstandards prüfen. Diese Seite ist eine erste Orientierung, keine vollständige Wiedergabe der IFRS-Regeln.","checkText":"1. Unternehmen, Sachverhalt und Stichtag bestimmen. 2. Anwendbaren Standard und Ausnahmen bestätigen. 3. Ermessensentscheidungen und Schätzungen dokumentieren. 4. Buchungen, Abschlüsse und Angaben abstimmen.","discloseText":"Ausweis, Bilanzierungsgrundsätze, wesentliche Schätzungen und Angaben anhand der maßgeblichen Originalvorschriften prüfen; übergreifende und lokale Vorschriften beachten.","coming":"Künftig anzuwendender Standard: Datum, frühzeitige Anwendung und lokale Übernahme prüfen.","year":"Technisches Verzeichnis · kein Ersatz für verbindliche IFRS-Texte."}]};let language=localStorage.getItem('atlas_lang')||'en';let selected='IFRS 9';const el=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function t(){return DB.lang.find(x=>x.code===language)}function render(){document.documentElement.lang=language;let x=t();el('heading').textContent=x.head;el('summary').textContent=x.summary;el('search').placeholder=x.search;el('footer').textContent=x.year;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===language));let categories=[...new Set(DB.standards.map(s=>s[2]))];let old=el('filter').value;el('filter').innerHTML='<option value="">'+escapeHTML(x.all)+'</option>'+categories.map(c=>'<option>'+escapeHTML(c)+'</option>').join('');el('filter').value=old;renderNav();renderArticle()}function renderNav(){let q=el('search').value.toLowerCase(),cat=el('filter').value;el('nav').innerHTML=DB.standards.filter(s=>(!cat||s[2]===cat)&&(s[0]+' '+s[1]).toLowerCase().includes(q)).map(s=>'<button data-id="'+s[0]+'" class="'+(selected===s[0]?'active':'')+'"><small>'+escapeHTML(s[0])+'</small>'+escapeHTML(s[1])+'</button>').join('');el('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;renderNav();renderArticle()})}function renderArticle(){let s=DB.standards.find(s=>s[0]===selected);if(!s)return;let x=t(),idx=['it','en','de'].indexOf(language),d=DB.details[s[0]];let future=['IFRS 18','IFRS 19','IFRS 20'].includes(s[0]);el('article').innerHTML='<span class="pill">'+escapeHTML(s[0])+'</span><span class="pill">'+escapeHTML(s[2])+'</span>'+(future?'<span class="pill">Future-effective</span>':'')+'<h2>'+escapeHTML(s[1])+'</h2><section><h3>'+escapeHTML(x.scope)+'</h3><p>'+escapeHTML(d?d[idx]:x.fallback)+'</p></section><section><h3>'+escapeHTML(x.example)+'</h3><div class="case">'+escapeHTML(d?d[3]:x.checkText)+'</div></section><section><h3>'+escapeHTML(x.check)+'</h3><p>'+escapeHTML(x.checkText)+'</p></section><section><h3>'+escapeHTML(x.disclose)+'</h3><p>'+escapeHTML(x.discloseText)+'</p></section>'+(future?'<p class="case">'+escapeHTML(x.coming)+'</p>':'')+'<section class="links"><h3>'+escapeHTML(x.refs)+'</h3><a href="https://www.ifrs.org/issued-standards/list-of-standards/" target="_blank" rel="noopener">IFRS Foundation ↗</a><a href="https://www.efrag.org/en/financial-reporting/endorsement-status" target="_blank" rel="noopener">EFRAG ↗</a></section>'}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{language=b.dataset.lang;localStorage.setItem('atlas_lang',language);render()});el('search').addEventListener('input',renderNav);el('filter').addEventListener('change',renderNav);render();</script></body></html>
